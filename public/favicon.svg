<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38a169" />
      <stop offset="100%" stop-color="#276749" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b5893d" />
      <stop offset="100%" stop-color="#e6b356" />
    </linearGradient>
  </defs>
  
  <!-- Outer Ring representing precision/science -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#leafGrad)" stroke-width="24" stroke-linecap="round" />
  
  <!-- Curved contour line representing topography and soil management -->
  <path d="M 110 370 Q 256 450 402 370" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
  
  <!-- Sprout / Leaf representing growth and agronomy -->
  <path d="M 256 90 C 350 180 340 300 256 390 C 172 300 162 180 256 90 Z" fill="url(#leafGrad)" />
  
  <!-- Small inner leaf representing science, embryo, and genetic potential -->
  <path d="M 256 210 C 295 245 295 305 256 350 C 217 305 217 245 256 210 Z" fill="url(#goldGrad)" />
  
  <!-- Central spine -->
  <path d="M 256 120 L 256 390" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.35" />
</svg>